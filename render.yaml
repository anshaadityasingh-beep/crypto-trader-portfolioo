services:
  - type: web
    name: crypto-trader-backend
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false # Set this manually in the Render dashboard (e.g. from Supabase)
      - key: JWT_SECRET
        sync: false # Set this manually in the Render dashboard
      - key: REDIS_URL
        sync: false # Optional, for horizontal scaling
      - key: MARKET_MAKER_TICK_MS
        value: 3000
      - key: MARKET_MAKER_MAX_ORDERS
        value: 50
